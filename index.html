<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Coding Session</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link to e.g. /intro/3
      first hits 404.html, which re-encodes the path into a query string and
      redirects here (see public/404.html). This script reverses that encoding
      before the router reads location.pathname, so the intended route survives
      the round trip. See docs/adr/0002-pushstate-routing-with-404-fallback.md.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
